syntax = "proto3";

package accountstatement;

service AccountStatementService
{
    rpc GetAccountStatements(GetAccountStatementsRequest)
        returns (stream AccountStatementItem);
}

message GetAccountStatementsRequest
{
    string accountId = 1;
}

message AccountStatementItem
{
    string transactionId = 1;
    string description = 2;
    double amount = 3;
    string transactionType = 4;
    string transactionDate = 5;
    double balance = 6;
}
